[project]
name = "localupscale-backend"
version = "0.1.0"
description = "Backend local de LocalUpscale : agrandissement d'images par IA, 100 % hors ligne."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Moteur IA Real-ESRGAN (lourd) : à installer explicitement.
# Sans GPU, le moteur s'exécute sur le processeur — nettement plus lent.
# basicsr est déclaré explicitement : realesrgan l'importe (RRDBNet) sans
# toujours le tirer de façon fiable.
ia = [
    "torch>=2.1",
    "torchvision>=0.16",
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
]
# Amélioration des visages (GFPGAN) : installation SÉPARÉE et facultative.
# L'application fonctionne normalement sans cet extra ; l'option est alors
# désactivée dans l'interface, avec la raison affichée.
visages = [
    "gfpgan>=1.3.8",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
